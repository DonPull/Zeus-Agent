name: Offline regression

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      ZEUS_OFFLINE_TEST: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@1.94.1
      - run: npm ci
      - name: Prepare isolated pinned browser runtime
        run: python scripts/browser_service/setup_runtime.py --destination .zeus/browser-runtime/venv --install
      - name: Install matching browser explicitly
        run: .zeus/browser-runtime/venv/Scripts/python.exe -m playwright install chromium
      - run: npm run build
      - run: npm run test:regression
      - name: Build release runtime for transport regression
        run: cargo build --manifest-path src-tauri/Cargo.toml --release --locked --bin zeus-evaluation --features evaluation-runner
      - name: Release large-image and fresh-TLS regression
        env:
          ZEUS_TEST_RELEASE: '1'
        run: node node_modules/@playwright/test/cli.js test --config=playwright.offline.config.js tests/regression/attachments.spec.js tests/regression/browser_ownership.spec.js --grep "large valid image|one root-owned browser|Stop during navigation"
      - run: npm run eval:demo
